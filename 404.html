<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Seite nicht gefunden | Nelson Lankanesan</title>
<meta name="description" content="Diese Seite existiert nicht.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0f16">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script>
(function () {
  var root = document.documentElement;
  root.classList.add('js');
  try {
    var stored = localStorage.getItem('nl-theme');
    var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    root.dataset.theme = stored || (prefersLight ? 'light' : 'dark');
  } catch (e) { /* localStorage blockiert - Standardwerte bleiben bestehen */ }
})();
</script>
<style>
  /* Eigenstaendiges Layout: die Fehlerseite braucht keine Sektionslogik */
  .error { min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem 0; }
  .error__code {
    /* Eigene Klasse statt .error p - sonst gewinnt die Textfarbe des Absatzes */
    font-family: var(--font-mono);
    font-size: clamp(4rem, 3rem + 10vw, 9rem);
    font-weight: 500;
    line-height: 1;
    margin: 0;
    background: linear-gradient(100deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
  }
  .error__title { font-size: var(--step-2); margin: 1.2rem 0 .8rem; }
  .error__text { color: var(--text-muted); max-width: 44ch; margin: 0 auto 2rem; }
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true">
  <div class="backdrop__grid"></div>
  <div class="backdrop__glow"></div>
</div>

<main class="error">
  <div class="wrap">
    <p class="error__code">404</p>
    <h1 class="error__title">Diese Ressource wurde nie provisioniert</h1>
    <p class="error__text">
      Die aufgerufene Seite gibt es nicht - jedenfalls nicht in diesem State.
      Zurück zur Startseite?
    </p>
    <a class="btn btn--primary" href="/">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      <span>Zur Startseite</span>
    </a>
  </div>
</main>
</body>
</html>
