# Veroeffentlicht die statische Seite auf GitHub Pages.
# Voraussetzung: Settings > Pages > Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Parallele Deployments vermeiden, laufende Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Es gibt keinen Build-Schritt - das Repository ist die Seite
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
