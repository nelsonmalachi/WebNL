<!DOCTYPE html><html><head><meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#0b0f16;font-family:Inter,sans-serif;color:#e8eef7;
position:relative;overflow:hidden}
.grid{position:absolute;inset:0;
background-image:linear-gradient(to right,#1a2536 1px,transparent 1px),linear-gradient(to bottom,#1a2536 1px,transparent 1px);
background-size:60px 60px;opacity:.6;
-webkit-mask-image:radial-gradient(ellipse 80% 70% at 30% 10%,#000 10%,transparent 75%)}
.glow{position:absolute;top:-320px;left:-160px;width:900px;height:900px;border-radius:50%;
background:radial-gradient(circle,rgba(77,163,255,.18) 0%,transparent 62%)}
.inner{position:relative;padding:82px 90px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.mark{width:74px;height:74px;border-radius:20px;background:linear-gradient(140deg,#4da3ff,#59e3c8);
display:flex;align-items:center;justify-content:center;color:#051019;
font-family:'JetBrains Mono',monospace;font-weight:500;font-size:26px}
h1{font-size:74px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.grad{background:linear-gradient(100deg,#4da3ff,#59e3c8);-webkit-background-clip:text;background-clip:text;color:transparent}
p.sub{margin-top:22px;font-size:27px;color:#9aabc2;max-width:34ch;line-height:1.45}
.foot{display:flex;align-items:center;justify-content:space-between;
border-top:1px solid #223047;padding-top:26px}
.tags{display:flex;gap:12px}
.tags span{border:1px solid #223047;border-radius:999px;padding:9px 20px;font-size:19px;color:#9aabc2}
.dom{font-family:'JetBrains Mono',monospace;font-size:21px;color:#4da3ff}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="inner">
  <div class="mark">NL</div>
  <div>
    <h1>Nelson Lankanesan<br><span class="grad">Cloud Engineer</span></h1>
    <p class="sub">Azure, Terraform, PowerShell.</p>
  </div>
  <div class="foot">
    <div class="tags"><span>Infrastructure as Code</span><span>Automation</span><span>Azure</span></div>
    <div class="dom">lankanesan.ch</div>
  </div>
</div></body></html>
